<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holy Cross English School</title>
  <style>
    /* Internal CSS starts here */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f3f7fa;
    }

    header {
      background-color: #0055a5;
      color: white;
      text-align: center;
      padding: 20px 0;
    }

    nav {
      background-color: #003d73;
      overflow: hidden;
    }

    nav a {

      display: block;

      text-align: center;

      text-decoration: none;
    }

    nav a:hover {
      background-color: #0074d9;
    }

    .hero {
      background-image: url('https://images.unsplash.com/photo-1571260899304-425eee4c7efc');
      background-size: cover;
      background-position: center;
      color: white;
      text-align: center;
      padding: 100px 20px;
    }

    .hero h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 20px;
    }

    section {
      padding: 40px;
      text-align: center;
    }

    .about, .contact {
      background-color: #ffffff;
      margin: 20px auto;
      width: 80%;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      border-radius: 10px;
      padding: 20px;
    }

    footer {
      background-color: #003d73;
      color: white;
      text-align: center;
      padding: 10px;
      margin-top: 20px;
    }
  </style>
